name: Extract ZIP to Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          rm -rf "Dadelange Editor"
          mkdir -p "Dadelange Editor"
          unzip -o "Dadelange Editor Beta.zip" -d "Dadelange Editor"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "Dadelange Editor"
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract Dadelange Editor Beta"
            git push
          fi
